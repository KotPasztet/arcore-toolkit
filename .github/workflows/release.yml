name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python tests and package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest build
          pytest -q
          python -m build

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "${GITHUB_REF_NAME:-}" == v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
          else
            version_name="${version}-build.${GITHUB_RUN_NUMBER}"
          fi
          tag="v${version_name}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$version_name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # The Gradle app build needs platforms;android-35 + build-tools;35.0.0.
      # The NDK below is only used by the tools/shim build.
      - name: Android SDK packages
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          ndk_dir=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$ndk_dir" ]; then
            "$SDKMANAGER" --install "ndk;27.2.12479018"
            ndk_dir="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_ROOT=$ndk_dir" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          ./gradlew :android:assembleDebug --no-daemon \
            "-PappVersionCode=$APP_VERSION_CODE" \
            "-PappVersionName=$APP_VERSION_NAME"
          APK=$(ls android/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" "arcore-toolkit-$APP_VERSION_NAME.apk"

      - name: Build shim
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          cd tools/shim
          ./build.sh
          cp libarcore_sdk_c.so "libarcore_sdk_c-${VERSION_NAME}.so"
          SHIM_INC=passthrough.inc SHIM_NO_OVERRIDES=1 \
            OUT=libarcore_sdk_c_stock.so ./build.sh
          cp libarcore_sdk_c_stock.so "libarcore_sdk_c_stock-${VERSION_NAME}.so"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ARCore Toolkit ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*
            arcore-toolkit-${{ steps.version.outputs.version_name }}.apk
            tools/shim/libarcore_sdk_c-${{ steps.version.outputs.version_name }}.so
            tools/shim/libarcore_sdk_c_stock-${{ steps.version.outputs.version_name }}.so
            tools/shim/patch_apk.py
