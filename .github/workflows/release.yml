name: release

# Releases are manual: run this workflow from the Actions tab only after the
# build/tracking change has been tested on a device.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional stable release key.  Set these repository secrets to sign every
      # release with the same key; without them the build uses a throwaway debug
      # keystore (fine for testing, but users must uninstall between releases).
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "KS=$RUNNER_TEMP/release.keystore"
              echo "KS_PASS=${ANDROID_KEYSTORE_PASSWORD:-android}"
              echo "KEY_ALIAS=${ANDROID_KEY_ALIAS:-debug}"
              echo "KEY_PASS=${ANDROID_KEY_PASSWORD:-android}"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python tests and package
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest build
          pytest -q
          python -m build

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          version_name="${version}-build.${GITHUB_RUN_NUMBER}"
          tag="v${version_name}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$version_name" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        shell: bash
        run: |
          test -n "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          ndk_dir=$(ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$ndk_dir" ]; then
            "$SDKMANAGER" --install "ndk;27.2.12479018"
            ndk_dir="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_ROOT=$ndk_dir" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          OUT: arcore-toolkit-${{ steps.version.outputs.version_name }}.apk
        run: |
          cd android
          ./build.sh

      - name: Build shim
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          cd tools/shim
          ./build.sh
          cp libarcore_sdk_c.so "libarcore_sdk_c-${VERSION_NAME}.so"
          SHIM_INC=passthrough.inc SHIM_NO_OVERRIDES=1 \
            OUT=libarcore_sdk_c_stock.so ./build.sh
          cp libarcore_sdk_c_stock.so "libarcore_sdk_c_stock-${VERSION_NAME}.so"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ARCore Toolkit ${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*
            android/arcore-toolkit-${{ steps.version.outputs.version_name }}.apk
            tools/shim/libarcore_sdk_c-${{ steps.version.outputs.version_name }}.so
            tools/shim/libarcore_sdk_c_stock-${{ steps.version.outputs.version_name }}.so
            tools/shim/patch_apk.py
