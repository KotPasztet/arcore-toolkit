name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - run: pytest -q

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        shell: bash
        run: |
          mapfile -t scripts < <(find . -name '*.sh' -not -path './.git/*' -not -path './third_party/*')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found; skipping bash -n check."
            exit 0
          fi
          rc=0
          for f in "${scripts[@]}"; do
            bash -n "$f" || rc=1
          done
          exit $rc

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build debug APK
        shell: bash
        run: |
          ./gradlew :android:assembleDebug --no-daemon \
            "-PappVersionCode=${{ github.run_number }}" \
            "-PappVersionName=0.3.0-build.${{ github.run_number }}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arcore-toolkit-debug-${{ github.run_number }}
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
